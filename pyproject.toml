[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimax-aipe"
version = "0.1.0"
description = "Implementation of Minimax-AIPE: Solving Convex-Concave Problems with Õ(ε^{-4/7}) Second-Order Oracle Complexity"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.26",
    "equinox>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]
metal = [
    "jax-metal>=0.0.5",
]
mps = [
    "jax-mps",
]

[tool.hatch.build.targets.wheel]
packages = ["minimax_aipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
